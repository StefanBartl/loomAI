# Builds the Windows installer (loomai-setup-<version>-x64.exe) and attaches it, with the install script of
# the release and SHA256SUMS, to a GitHub Release -- so "get loomAI" means "open Releases and download one
# file" (or run the install line) instead of "install MSYS2 and run scripts/setup.ps1".
#
# Cutting a release (the same shape as docmap-desktop's):
#
#   1. CI-green main, then tag and push:
#        git tag -a v0.1.0 -m "what is in this release"
#        git push origin v0.1.0
#   2. This workflow checks the tag, builds, verifies and publishes a DRAFT release. A draft on purpose: a
#      green build is not the same guarantee as someone having installed the result, so download it, run
#      it, then publish:
#        gh release download v0.1.0 --dir .        (the installer, install.ps1, SHA256SUMS)
#        .\install.ps1 -File .\loomai-setup-0.1.0-x64.exe        (the script on the draft: the sums are
#                                                                 found beside the file; the download path
#                                                                 cannot reach a draft's files)
#        gh release edit v0.1.0 --draft=false
#      Update over a running server and the uninstall are tried by the build already; a person opens the
#      result on a clean user account all the same.
#   3. Something wrong? Delete draft and tag together, fix, start over:
#        gh release delete v0.1.0 --yes --cleanup-tag
#      A published release is never cut again: a mistake is fixed in the next patch version.
#
# A pushed tag must be exactly vX.Y.Z (the installer version is numeric), on main, with a green ci run for
# that very commit (`check`). Running the workflow by hand (Actions -> Release -> Run workflow, or
# `gh workflow run release.yml`) is a dry run: it builds and verifies the installer from the chosen branch and
# uploads it as a workflow artifact, and never creates a release.
#
# What "verifies" means: see .github/actions/installer-build (build, install silently through the install
# script of the release-kit, start, check /health and the dashboard, uninstall, check the user PATH).
#
# The draft, its files and the checksums are made by the action `publish` of appkit's release-kit, pinned by
# the commit of tools/release-kit.pin (tools/check-release-kit-pin.py checks that they agree). The install
# script it attaches is stamped for this tag: it installs exactly this release, without a browser download
# in the way of SmartScreen. The installer is not code-signed; the release notes say so.
#
# Actions are pinned by commit; a job gets only the rights it needs.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# One run per tag at a time: a tag deleted and set again waits for the run it replaces.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Only for a pushed tag.
  check:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag and the CI of this commit agree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          # Exactly vX.Y.Z: the installer version is numeric, and a tag like v1.2.3.4 would only fail
          # later, on a Windows runner.
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+[.][0-9]+[.][0-9]+$'; then
            echo "::error::the tag $tag is not vX.Y.Z"
            exit 1
          fi
          # A release comes from main, never from a side branch.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the commit of the tag is not on main"
            exit 1
          fi
          green="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq 'length')"
          if [ "$green" -lt 1 ]; then
            echo "::error::no green ci run for $GITHUB_SHA: wait for it, or fix main, then tag again"
            exit 1
          fi
          # A published release is never cut again: stop before anything is built. "No such release" is the
          # good answer (a draft is invisible to this token, and fine); any other failure of gh is not
          # taken for it.
          if answer="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>&1)"; then
            if [ "$answer" != "true" ]; then
              echo "::error::the release $tag is published: it is never cut again, make a patch release"
              exit 1
            fi
          elif ! printf '%s' "$answer" | grep -qi 'release not found'; then
            echo "::error::cannot ask GitHub about the release $tag: $answer"
            exit 1
          fi

  build:
    needs: check
    # The check is skipped for a dry run by hand; a failed check stops the build.
    if: ${{ !cancelled() && (needs.check.result == 'success' || needs.check.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false

      - name: work out the version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') {
              throw "tag '$env:GITHUB_REF_NAME' is not of the form vX.Y.Z"
            }
            $version = $Matches[1]
          } else {
            $version = '0.0.0' # dry run, never published
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "version: $version"

      # The install script the installer is tried through is the one that will be stamped and attached: the
      # release-kit at the commit of tools/release-kit.pin.
      - name: Read the pinned release-kit commit
        id: kit
        shell: bash
        run: echo "commit=$(sed -n 's/^commit *= *//p' tools/release-kit.pin)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          repository: StefanBartl/appkit
          ref: ${{ steps.kit.outputs.commit }}
          path: .kit
          persist-credentials: false

      - uses: ./.github/actions/installer-build
        id: installer
        with:
          version: ${{ steps.version.outputs.version }}
          install-script: .kit/release-kit/scripts/install.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loomai-setup
          path: ${{ steps.installer.outputs.file }}
          if-no-files-found: error
          retention-days: 7

  # Only for a pushed tag, and the only job that may write to the repository.
  publish:
    if: github.ref_type == 'tag'
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: loomai-setup
          path: dist
      - uses: StefanBartl/appkit/release-kit/publish@e76ee82e2484d53c18350a33e6530e8b8c33ca08 # v0.19.1
        with:
          token: ${{ github.token }}
          tag: ${{ github.ref_name }}
          title: loomAI ${{ github.ref_name }}
          files: dist
          expect: 1
          app: loomai
          windows-kind: inno
          windows-release-asset: loomai-setup-{version}-x64.exe
          windows-rolling-asset: loomai-setup-x64.exe
          notes-file: .github/release-notes.md
